# Phase 2: a furnace on the mod hooks, to compare with vanilla's tick by tick.
[mod]
id = "mekmachine"
version = "0.1.0"

[compatibility]
horizon_revision = "f319701e8c9ab657ff562250b3ba07b2d654e3bc"

[[crate]]
id = "engine"
path = "engine"

[[injection]]
id = "blocks"
hook = "blocks"
hook_version = 1
kind = "HEAD"
helper = "blocks.rs"
bindings = [{ name = "blocks", ty = "&mut Vec<horizon_mods::content::Block>", value = "&mut *blocks" }]

[[injection]]
id = "block_entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "&mut *entity" },
]

[[injection]]
id = "ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "container"
hook = "block_entity_container"
hook_version = 1
kind = "HEAD"
helper = "container.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<horizon_client::containers::ModContainer>", value = "&mut *container" },
]

[[injection]]
id = "tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "&mut *entity" },
]

[[injection]]
id = "energy"
hook = "block_entity_energy"
hook_version = 1
kind = "HEAD"
helper = "energy.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "energy", ty = "&mut Option<horizon_client::containers::ModEnergyBuffer>", value = "&mut *energy" },
]

[[injection]]
id = "fluids"
hook = "block_entity_fluids"
hook_version = 1
kind = "HEAD"
helper = "fluids.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "fluids", ty = "&mut Option<horizon_client::containers::ModFluidTanks>", value = "&mut *fluids" },
]

[[injection]]
id = "transfer"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "transfer.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "&mut *entity" },
]

[[injection]]
id = "machines"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "machines.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "&mut *entity" },
]

[[module]]
id = "mek"
file = "crates/horizon-client/src/game.rs"
name = "mek"
source = "mek.rs"

[[injection]]
id = "power"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "power.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "&mut *entity" },
]

[[injection]]
id = "networks"
hook = "level_tick_post"
hook_version = 1
kind = "HEAD"
helper = "networks.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "screen"
hook = "screen"
hook_version = 1
kind = "HEAD"
helper = "screen.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "screen", ty = "&mut Option<horizon_client::mod_api::NativeScreen>", value = "&mut *screen" },
]

[[injection]]
id = "screen_draw"
hook = "screen_draw"
hook_version = 1
kind = "HEAD"
helper = "screen_draw.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "block", ty = "&str", value = "block" },
  { name = "data", ty = "&[i32]", value = "data" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "origin", ty = "[f32; 2]", value = "origin" },
]

[[injection]]
id = "screen_click"
hook = "screen_click"
hook_version = 1
kind = "HEAD"
helper = "screen_click.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "at", ty = "[f32; 2]", value = "at" },
  { name = "button", ty = "&mut Option<i32>", value = "&mut *button" },
]

[[injection]]
id = "menu_button"
hook = "menu_button"
hook_version = 1
kind = "HEAD"
helper = "menu_button.rs"
bindings = [
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "&mut *entity" },
  { name = "id", ty = "i32", value = "id" },
]

[[injection]]
id = "container_accepts"
target = "horizon_client::game::native_hooks::Game<'_>::native_container_accepts"
kind = "HEAD"
helper = "container_accepts.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&horizon_client::containers::ModBlockEntity", value = "&*entity" },
  { name = "slot", ty = "usize", value = "slot" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "face", ty = "Option<horizon_core::geometry::Direction>", value = "face" },
  { name = "cancel", ty = "&mut bool", value = "&mut *cancel" },
]
